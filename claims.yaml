retracted:

  - id: hw.q8.27b.tower2-decode-narrows-at-long-ctx
    formerly_claimed: >
      Tower2's decode lead narrows from 3× at short-ctx to 1.2× at ctx=16K
      against M5 Max — implying Apple Silicon catches up on long-context decode.
    status: retracted
    retracted_in: "hardware-tests/qwen3.6-q8-fleet-2026-05-17 (replaced by [hw.q8.engine.blackwell-cuda-long-ctx-broken])"
    reason: >
      The 'narrowing' was llama.cpp/CUDA engine-side breakdown on Blackwell at
      long context, not silicon. Under vLLM/FP8 on the same hardware, ctx=16K
      decode is 49.3 tok/s — the lead doesn't narrow at all. The earlier
      framing misattributed engine behavior to hardware.

  - id: hw.q8.total-tokps-composite
    formerly_claimed: >
      Earlier drafts synthesized prefill, decode, and TTFT into a single
      "total tok/s = (prompt + gen) / batch_wall" composite.
    status: retracted
    retracted_in: "hardware-tests/qwen3.6-q8-fleet-2026-05-17"
    reason: >
      Mathematically defensible but reads misleadingly — at ctx=4 K with
      mostly-prefill work, total-tok/s lands near the prefill rate (~187)
      even though decode-streaming is ~48 tok/s. Replaced by the three-column
      headline (prefill / decode / TTFT) with no composite. See AUDIT B19.
